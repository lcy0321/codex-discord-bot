[project]
name = "codex-discord-bot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "discord-py>=2.7.1,<2.8.0",
    "openai-codex>=0.163.0,<0.163.1",
    "pydantic>=2.13.5,<2.14.0",
    "pydantic-settings>=2.16.0,<2.17.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0,<1.5.0",
    "pytest>=9.1.1,<9.2.0",
    "ruff>=0.17.1,<0.17.2",
]

[tool.uv]
package = false
exclude-newer = "7 days"
add-bounds = "minor"

[tool.pyrefly]
preset = "strict"
