[project]
name = "codex-discord-bot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "discord.py==2.7.1",
    "openai-codex==0.154.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pyrefly]
preset = "strict"
