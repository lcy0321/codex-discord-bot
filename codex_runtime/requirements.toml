allowed_approval_policies = ["never"]
allowed_sandbox_modes = ["read-only"]
allow_managed_hooks_only = true

[features]
hooks = true

# Read-only sandboxing alone does not prevent tool-based file reads.
[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /app/codex_runtime/tool_policy.py"
timeout = 5
